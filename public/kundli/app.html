<title>Kundli Software Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Tiro+Devanagari+Hindi&family=Hind:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: an astrologer's console. Starry gradient sky behind glass panels; section rail on the left (bottom bar on phones); one working sheet on the right.
   Tokens below are the "Royal Night" theme; the Look & Feel panel rewrites them at runtime. */
:root {
  --bg: #f4f2ff; --bg2: #fff6e5; --sheet: rgba(255,255,255,.86); --chip: #eef0fb; --ink: #1a1f45; --muted: #5d6390; --line: #e0e2f2;
  --navy: #2a2f86; --gold: #c8891a; --accent2: #e0573a; --on-solid: #ffffff; --stars: 0;
  --good: #17804f; --bad: #c0392b; --neutral: #9a6b00;
  --pc0: #d9640f; --pc1: #4a5578; --pc2: #d62839; --pc3: #138a4f; --pc4: #b07d00; --pc5: #c2187a; --pc6: #2f5fd0; --pc7: #6a4fd0; --pc8: #8a6a35;
  --f-display: "Tiro Devanagari Hindi", Georgia, serif;
  --f-brand: "Cinzel", "Tiro Devanagari Hindi", Georgia, serif;
  --f-body: "Hind", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --fs: 15px; --radius: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0f2c; --bg2: #1b1450; --sheet: rgba(23,30,72,.66); --chip: rgba(255,255,255,.07); --ink: #eef0ff; --muted: #a9b0dc; --line: rgba(170,180,255,.16);
  --navy: #ffe3a3; --gold: #f5b942; --accent2: #ff7a59; --on-solid: #10131f; --stars: 1;
  --good: #5ee0a0; --bad: #ff8a7a; --neutral: #f2c66b;
  --pc0: #ff9f5a; --pc1: #e6ecff; --pc2: #ff6b6b; --pc3: #4fe39a; --pc4: #ffd34d; --pc5: #ff8fcf; --pc6: #7aa7ff; --pc7: #b9a8ff; --pc8: #d9b98a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0a0f2c; --bg2: #1b1450; --sheet: rgba(23,30,72,.66); --chip: rgba(255,255,255,.07); --ink: #eef0ff; --muted: #a9b0dc; --line: rgba(170,180,255,.16);
  --navy: #ffe3a3; --gold: #f5b942; --accent2: #ff7a59; --on-solid: #10131f; --stars: 1;
  --good: #5ee0a0; --bad: #ff8a7a; --neutral: #f2c66b;
  --pc0: #ff9f5a; --pc1: #e6ecff; --pc2: #ff6b6b; --pc3: #4fe39a; --pc4: #ffd34d; --pc5: #ff8fcf; --pc6: #7aa7ff; --pc7: #b9a8ff; --pc8: #d9b98a;
  color-scheme: dark; }
:root {
  --gold-soft: color-mix(in srgb, var(--gold) 16%, transparent);
  --good-soft: color-mix(in srgb, var(--good) 16%, transparent);
  --bad-soft: color-mix(in srgb, var(--bad) 15%, transparent);
  --neutral-soft: color-mix(in srgb, var(--neutral) 16%, transparent);
  --grad: linear-gradient(120deg, var(--gold), var(--accent2));
}
* { box-sizing: border-box; }
html { background: var(--bg); font-size: var(--fs); }
body { margin: 0; min-height: 100%; color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.5;
  background:
    radial-gradient(900px 520px at 0% -8%, color-mix(in srgb, var(--gold) 22%, transparent), transparent 70%),
    radial-gradient(800px 600px at 105% 10%, color-mix(in srgb, var(--accent2) 18%, transparent), transparent 70%),
    linear-gradient(165deg, var(--bg) 0%, var(--bg2) 100%) fixed;
  background-attachment: fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: calc(var(--stars) * .85);
  background-image:
    radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 28% 72%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 46% 33%, #fff, transparent), radial-gradient(1px 1px at 63% 81%, #fff, transparent),
    radial-gradient(1.6px 1.6px at 78% 22%, #fff, transparent), radial-gradient(1px 1px at 88% 58%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 7% 88%, #fff, transparent), radial-gradient(1px 1px at 53% 8%, #fff, transparent),
    radial-gradient(1.3px 1.3px at 36% 50%, #fff, transparent), radial-gradient(1px 1px at 95% 92%, #fff, transparent);
  background-size: 520px 520px; }
@media (prefers-reduced-motion: no-preference) { body::after { animation: twinkle 7s ease-in-out infinite alternate; } }
@keyframes twinkle { from { opacity: calc(var(--stars) * .45); } to { opacity: calc(var(--stars) * .9); } }
.wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; }
small { color: var(--muted); font-size: 0.78em; margin-left: 3px; }
.num, td.t, .t { font-variant-numeric: tabular-nums; white-space: nowrap; }
button { font: inherit; color: inherit; }
svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* header */
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 54px; height: 54px; flex: none; }
.logo circle, .logo path { fill: none; stroke: var(--gold); stroke-width: 1.4; }
.logo .sun { fill: var(--gold); stroke: none; }
@media (prefers-reduced-motion: no-preference) { .logo .ring { transform-origin: 32px 32px; animation: spin 60s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.brand h1 { font-family: var(--f-brand); font-size: 1.85rem; line-height: 1.1; letter-spacing: .02em;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
.hdr-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.badge-test { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 60%, transparent); border-radius: 999px; padding: 3px 10px; }
.iconbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--sheet); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
.iconbtn:hover { border-color: var(--gold); }
.iconbtn .sw { width: 16px; height: 16px; border-radius: 50%; background: var(--grad); }

/* controls */
.controls { background: var(--sheet); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); align-items: end; }
label.f { display: grid; gap: 4px; font-size: 0.8rem; color: var(--muted); letter-spacing: 0.02em; min-width: 0; }
input, select { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0; font-size: .95rem; }
select option { background: var(--bg); color: var(--ink); }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--chip); padding: 3px; gap: 2px; }
.seg button { background: transparent; border: 0; padding: 6px 13px; cursor: pointer; color: var(--muted); border-radius: 999px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--grad); color: var(--on-solid); box-shadow: 0 2px 10px color-mix(in srgb, var(--gold) 35%, transparent); }
.btn { background: var(--grad); color: var(--on-solid); border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; font-weight: 600; box-shadow: 0 4px 16px color-mix(in srgb, var(--gold) 30%, transparent); }
.btn.ghost { background: var(--chip); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.btn:hover { filter: brightness(1.06); }
.custom { display: contents; } .custom[hidden] { display: none; }

/* app frame */
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 18px; align-items: start; }
.side { display: grid; gap: 3px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--sheet); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
.side .grp { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 4px; }
.side button { display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; border-radius: 12px; padding: 9px 11px; cursor: pointer; color: var(--ink); font-weight: 500; }
.side button:hover { background: var(--chip); }
.side button[aria-selected="true"] { background: var(--grad); color: var(--on-solid); box-shadow: 0 4px 18px color-mix(in srgb, var(--gold) 35%, transparent); }
.maincol { display: grid; gap: 14px; min-width: 0; }
.sheet { background: var(--sheet); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 20px; min-width: 0;
  box-shadow: 0 20px 50px -30px color-mix(in srgb, var(--bg) 80%, #000); }
.bottombar { display: none; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; }
.wrap:has(.side.open) { z-index: 41; }

/* typography inside sheet */
.dayhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; align-items: baseline; }
.dayhead h2 { font-size: 1.7rem; color: var(--navy); }
.dayhead .meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.sunrow { display: flex; flex-wrap: wrap; gap: 8px; }
.sunrow > span { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--muted); }
.sunrow b { color: var(--ink); font-weight: 600; }
.now { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }
.now strong { margin-right: 4px; }
.limbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.limb { border: 1px solid var(--line); background: var(--chip); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; position: relative; overflow: hidden; }
.limb::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--grad); }
.limb .lbl { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.limb .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.limb .nm { font-family: var(--f-display); font-size: 1.2rem; }
.limb .row + .row .nm { font-size: 1rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; padding: 3px 11px; font-size: 0.85rem; background: var(--chip); border: 1px solid var(--line); }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.neutral { background: var(--neutral-soft); color: var(--neutral); border-color: transparent; }
.chip.sm { font-size: 0.74rem; padding: 1px 8px; }

/* timeline */
.tl { display: grid; gap: 6px; }
.tl-scroll { overflow-x: auto; }
.tl-inner { min-width: 640px; display: grid; gap: 6px; }
.lane { display: grid; grid-template-columns: 116px 1fr; align-items: center; gap: 8px; }
.lane .ln { font-size: 0.8rem; color: var(--muted); text-align: right; }
.track { position: relative; height: 24px; background: var(--chip); border-radius: 8px; }
.seg-b { position: absolute; top: 2px; bottom: 2px; border-radius: 6px; font-size: 0.68rem; line-height: 20px; padding: 0 5px; overflow: hidden; white-space: nowrap; color: var(--on-solid); font-weight: 600; }
.seg-b.good { background: var(--good); } .seg-b.bad { background: var(--bad); } .seg-b.neutral { background: var(--neutral); }
.nightshade { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--ink) 10%, transparent); border-radius: 0 8px 8px 0; }
.nowline { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.axis { position: relative; height: 16px; margin-left: 124px; font-size: 0.7rem; color: var(--muted); }
.axis span { position: absolute; transform: translateX(-50%); }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 18px; }
.box { display: grid; gap: 10px; align-content: start; min-width: 0; }
.box h3, .rem h3 { font-size: 1.2rem; color: var(--navy); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.box h3::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 10px var(--gold); }
.list { display: grid; gap: 0; }
.list .it { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.list .it:last-child { border-bottom: 0; }
.list .it { flex-wrap: wrap; } .list .it > :last-child:not(:first-child) { margin-left: auto; text-align: right; min-width: 0; overflow-wrap: anywhere; }
/* self-hosted top bar: full width */
.kbar { position: relative; z-index: 5; margin: -18px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 14px calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)) !important; padding-right: max(16px, env(safe-area-inset-right, 0px)) !important; }
/* touch screens: 16px inputs stop iPhone zooming in, and bigger tap targets */
@media (pointer: coarse) { input, select, textarea { font-size: 16px !important; } .btn.sm { padding: 9px 14px; } }
@media (max-width: 700px) { .fsize { display: none !important; } .tablewrap { -webkit-overflow-scrolling: touch; } .tablewrap table { font-size: .9rem; } }
.list .it b { text-align: right; font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; flex: none; transform: translateY(-1px); }
.dot.good { background: var(--good); } .dot.bad { background: var(--bad); } .dot.neutral { background: var(--neutral); }
.note { color: var(--muted); font-size: 0.84rem; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--chip); }
tr.current td { background: var(--gold-soft); }
tr.goodrow td:first-child { box-shadow: inset 3px 0 0 var(--good); }
tr.badrow td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
tr.neutralrow td:first-child { box-shadow: inset 3px 0 0 var(--neutral); }
.finder-form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); align-items: end; }
.fday { border: 1px solid var(--line); background: var(--chip); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.fday.blocked { opacity: 0.7; }
.fday .hd { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; }
.fwin { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline; padding: 6px 0; border-top: 1px dashed var(--line); }
.score { font-family: var(--f-mono); font-size: 0.8rem; padding: 1px 8px; border-radius: 6px; background: var(--good-soft); color: var(--good); }
.score.mid { background: var(--neutral-soft); color: var(--neutral); }
.score.low { background: var(--bad-soft); color: var(--bad); }
.why { font-size: 0.88rem; margin: 0; } .warn { font-size: 0.84rem; color: var(--bad); margin: 0; }
.foot { color: var(--muted); font-size: 0.8rem; }
.credit { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 14px 0 6px; letter-spacing: .02em; }
.err { padding: 12px; background: var(--bad-soft); color: var(--bad); border-radius: 12px; }
.copied { color: var(--good); font-size: 0.85rem; }

/* kundli */
fieldset.bform { border: 1px solid var(--line); background: var(--chip); border-radius: 16px; padding: 10px 14px 14px; margin: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); min-width: 0; }
fieldset.bform legend { font-family: var(--f-display); font-size: 1.05rem; color: var(--navy); padding: 0 8px; }
.bform .wide { grid-column: span 2; } @media (max-width: 520px) { .bform .wide { grid-column: auto; } }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; }
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 18px; border-radius: 18px; position: relative; overflow: hidden;
  background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 22%, transparent), color-mix(in srgb, var(--accent2) 16%, transparent)); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }
.hero .glyph { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 44px; line-height: 1; background: var(--grad); color: var(--on-solid); box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 18%, transparent), 0 10px 30px -10px var(--gold); }
.hero h2 { font-size: 1.8rem; color: var(--ink); }
.hero .meta { color: var(--muted); }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.summary > div { border: 1px solid var(--line); background: var(--chip); border-radius: 14px; padding: 10px 14px; display: grid; position: relative; overflow: hidden; }
.summary > div::after { content: ""; position: absolute; right: -20px; top: -20px; width: 60px; height: 60px; border-radius: 50%; background: var(--gold-soft); }
.summary .lbl, .lbl { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.summary b { font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; }
.cols > *, .box { min-width: 0; } .chartbox { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; justify-items: start; min-width: 0; } .chartbox .nchart { width: 100%; max-width: 420px; }
.nchart { width: 100%; max-width: 400px; aspect-ratio: 1; display: block; border-radius: 14px; background: color-mix(in srgb, var(--gold) 6%, transparent); }
.nchart .ln { fill: none; stroke: var(--gold); stroke-width: 1.6; }
.nchart .lnf { fill: none; stroke: color-mix(in srgb, var(--gold) 55%, transparent); stroke-width: 1.2; }
.nchart .sgn { fill: var(--muted); font-size: 12px; text-anchor: middle; dominant-baseline: middle; font-family: var(--f-body); }
.nchart .pl { font-size: 15px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; font-family: var(--f-body); fill: var(--ink); }
.nchart .ctr { fill: var(--muted); font-size: 13px; text-anchor: middle; font-family: var(--f-display); }
.pc0 { fill: var(--pc0); color: var(--pc0); } .pc1 { fill: var(--pc1); color: var(--pc1); } .pc2 { fill: var(--pc2); color: var(--pc2); } .pc3 { fill: var(--pc3); color: var(--pc3); }
.pc4 { fill: var(--pc4); color: var(--pc4); } .pc5 { fill: var(--pc5); color: var(--pc5); } .pc6 { fill: var(--pc6); color: var(--pc6); } .pc7 { fill: var(--pc7); color: var(--pc7); } .pc8 { fill: var(--pc8); color: var(--pc8); }
.pcAs { fill: var(--gold); color: var(--gold); }
.degs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px 12px; width: 100%; max-width: 420px; font-size: .9rem; }
.degs span { font-variant-numeric: tabular-nums; white-space: nowrap; } .degs b { font-weight: 700; margin-right: 4px; }
.legend { color: var(--muted); font-size: .78rem; }
.sbar { display: inline-block; width: 70px; height: 7px; border-radius: 4px; background: var(--chip); vertical-align: middle; overflow: hidden; border: 1px solid var(--line); }
.sbar.wide { width: 120px; }
.sbar > span { display: block; height: 100%; border-radius: 4px; }
.sbar > .good { background: var(--good); } .sbar > .neutral { background: var(--neutral); } .sbar > .bad { background: var(--bad); }
.adlist { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0; }
.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 8px; }

  const RASHI = [['Mesha','मेष'],['Vrishabha','वृषभ'],['Mithuna','मिथुन'],['Karka','कर्क'],['Simha','सिंह'],['Kanya','कन्या'],['Tula','तुला'],['Vrishchika','वृश्चिक'],['Dhanu','धनु'],['Makara','मकर'],['Kumbha','कुम्भ'],['Meena','मीन']];
  const MASA = [['Chaitra','चैत्र'],['Vaishakha','वैशाख'],['Jyeshtha','ज्येष्ठ'],['Ashadha','आषाढ़'],['Shravana','श्रावण'],['Bhadrapada','भाद्रपद'],['Ashwin','आश्विन'],['Kartika','कार्तिक'],['Margashirsha','मार्गशीर्ष'],['Pausha','पौष'],['Magha','माघ'],['Phalguna','फाल्गुन']];

  // Muhurta finder purposes: good nakshatras (0-26), weekdays (0=Sun), tithis to avoid (1-30), seasons to avoid
  const PURPOSES = {
    vehicle: { en: 'Vehicle purchase', hi: 'वाहन खरीद', nak: [0, 4, 6, 7, 12, 13, 14, 16, 21, 22, 23, 26], vaar: [1, 3, 4, 5], avoidTithi: [4, 9, 14, 30], avoid: ['panchak'] },
    gold: { en: 'Gold & jewellery', hi: 'सोना व आभूषण', nak: [0, 3, 6, 7, 12, 13, 14, 16, 21, 26], vaar: [0, 1, 3, 4, 5], avoidTithi: [4, 9, 14, 30], avoid: [] },
    property: { en: 'Property purchase', hi: 'संपत्ति खरीद', nak: [3, 4, 7, 11, 16, 20, 25, 26, 9, 18], vaar: [1, 3, 4, 5], avoidTithi: [4, 9, 14, 30], avoid: ['panchak', 'pitru'] },
    griha: { en: 'Griha pravesh', hi: 'गृह प्रवेश', nak: [3, 4, 11, 13, 16, 20, 22, 23, 25, 26], vaar: [1, 3, 4, 5], avoidTithi: [1, 4, 9, 14, 30], avoid: ['panchak', 'kharmas', 'adhik', 'chaturmas', 'pitru'] },
    marriage: { en: 'Marriage', hi: 'विवाह', nak: [3, 4, 9, 11, 12, 14, 16, 18, 20, 25, 26], vaar: [1, 3, 4, 5], avoidTithi: [4, 9, 14, 30], avoid: ['kharmas', 'adhik', 'chaturmas', 'pitru'] },

    naming: { en: 'Naming ceremony', hi: 'नामकरण', nak: [0, 3, 4, 6, 7, 11, 12, 13, 14, 16, 20, 21, 22, 23, 25, 26], vaar: [1, 3, 4, 5], avoidTithi: [4, 9, 14, 30], avoid: [] },
  };

  // ---------- astronomy ----------
  const norm = x => ((x % 360) + 360) % 360;
  const jdOf = ms => ms / DAY + 2440587.5;
  function ayanamsa(ms) { // Lahiri (Chitrapaksha), fitted to Swiss Ephemeris, 1900-2100 within ~0.0001 deg
    const t = (jdOf(ms) - 2451545.0) / 36525;
    return 23.857073 + 1.3968685 * t + 0.0003265 * t * t;
  }
  const sunTrop = ms => A.SunPosition(new Date(ms)).elon;
  const moonTrop = ms => A.EclipticGeoMoon(new Date(ms)).lon;
  function nutLon(ms) { // nutation in longitude (deg), main terms; sidereal positions are measured from the mean equinox
    const T = (jdOf(ms) - 2451545) / 36525, r = Math.PI / 180;
    const om = (125.04452 - 1934.136261 * T) * r, L = (280.4665 + 36000.7698 * T) * r, Lm = (218.3165 + 481267.8813 * T) * r;
    return (-17.2 * Math.sin(om) - 1.32 * Math.sin(2 * L) - 0.23 * Math.sin(2 * Lm) + 0.21 * Math.sin(2 * om)) / 3600;
  }
  const sunSid = ms => norm(sunTrop(ms) - nutLon(ms) - ayanamsa(ms));
  const moonSid = ms => norm(moonTrop(ms) - nutLon(ms) - ayanamsa(ms));
  const tithiAng = ms => norm(moonTrop(ms) - sunTrop(ms));
  const yogaAng = ms => norm(sunSid(ms) + moonSid(ms));

  // time when angle function reaches target, between t0 (before) and t1 (after)
  function cross(fn, target, t0, t1) {
    const g = t => ((fn(t) - target + 540) % 360) - 180;
    for (let i = 0; i < 34; i++) { const m = (t0 + t1) / 2; if (g(m) < 0) t0 = m; else t1 = m; }
    return (t0 + t1) / 2;
  }
  function spanAt(fn, span, ms) {
    const idx = Math.floor(fn(ms) / span + 1e-12);
    return { idx, start: cross(fn, idx * span, ms - 1.7 * DAY, ms), end: cross(fn, ((idx + 1) * span) % 360, ms, ms + 1.7 * DAY) };
  }
  function seq(fn, span, from, to) {
    const out = []; let t = from;
    while (t < to) { const s = spanAt(fn, span, t); out.push(s); t = s.end + 1000; }
    return out;
  }
  function ascSid(ms, lat, lon) {
    const T = (jdOf(ms) - 2451545) / 36525;
    const eps = (23.439291 - 0.0130042 * T) * Math.PI / 180;
    const ramc = norm(A.SiderealTime(new Date(ms)) * 15 + lon) * Math.PI / 180, phi = lat * Math.PI / 180;
    const asc = Math.atan2(Math.cos(ramc), -(Math.sin(ramc) * Math.cos(eps) + Math.tan(phi) * Math.sin(eps))) * 180 / Math.PI;
    return norm(asc - nutLon(ms) - ayanamsa(ms));
  }
  function riseSet(body, obs, dir, from) {
    const r = A.SearchRiseSet(body, obs, dir, new Date(from), 2);

  }

  // ---------- time zones ----------
  const dtfCache = {};
  function tzParts(ms, tz) {

    const p = {}; for (const x of f.formatToParts(new Date(ms))) p[x.type] = x.value;
    return p;
  }
  function tzOffset(ms, tz) {
    const p = tzParts(ms, tz);
    return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000;

  }

  function overlap(a, b) { const s = Math.max(a.start, b.start), e = Math.min(a.end, b.end); return e > s ? win(s, e) : null; }

    for (const b of bads) {

      for (const p of parts) {
        if (b.end <= p.start || b.start >= p.end) { next.push(p); continue; }
        if (b.start > p.start) next.push(win(p.start, b.start));
        if (b.end < p.end) next.push(win(b.end, p.end));
      }
      parts = next;

  function sidLon(i, ms) {
    if (i === 7) return norm(meanNode(ms) - P.ayanamsa(ms));
    if (i === 8) return norm(meanNode(ms) + 180 - P.ayanamsa(ms));
    return norm(tropLon(i, ms) - P.nutLon(ms) - P.ayanamsa(ms));
  }
  function birthUtc(b) {
    const local = Date.UTC(b.y, b.m - 1, b.d, b.hh, b.mi);
    let t = local - P.tzOffset(local, b.tz); t = local - P.tzOffset(t, b.tz);
    return t;
  }
  function dignity(i, sign) {
    if (i > 6) return EXALT[i] === sign ? 'exalted' : (EXALT[i] + 6) % 12 === sign ? 'debilitated' : 'neutral';
    if (EXALT[i] === sign) return 'exalted';
    if ((EXALT[i] + 6) % 12 === sign) return 'debilitated';
    if (OWN[i].includes(sign)) return 'own';
    const lord = SIGN_LORD[sign], r = REL[i][lord];
    return r > 0 ? 'friend' : r < 0 ? 'enemy' : 'neutral';
  }
  const DIG_SCORE = { exalted: 2, own: 1.5, friend: 0.5, neutral: 0, enemy: -0.5, debilitated: -2 };

  function chart(b) {
    const ms = birthUtc(b);
    const asc = P.ascSid(ms, b.lat, b.lon), lagna = Math.floor(asc / 30);
    const planets = [];
    for (let i = 0; i < 9; i++) {
      const lon = sidLon(i, ms), sign = Math.floor(lon / 30);
      const speed = i >= 7 ? -0.053 : norm(sidLon(i, ms + 3600000) - sidLon(i, ms - 3600000) + 180) - 180;
      const nak = Math.floor(lon / (360 / 27)), pada = Math.floor((lon % (360 / 27)) / (360 / 108)) + 1;
      const house = ((sign - lagna + 12) % 12) + 1;
      const d9 = Math.floor(lon / (30 / 9)) % 12;
      planets.push({ i, lon, sign, deg: lon % 30, nak, pada, house, d9, vargottama: d9 === sign, retro: i >= 7 || speed < 0, dignity: dignity(i, sign) });
    }
    const sun = planets[0].lon;
    for (const p of planets) if (p.i >= 1 && p.i <= 6) { const dd = Math.abs(norm(p.lon - sun + 180) - 180); p.combust = dd < COMBUST[p.i] - (p.retro && (p.i === 3 || p.i === 5) ? 2 : 0); }
    for (const p of planets) p.strength = strength(p);
    const moon = planets[1];
    const c = { input: b, ms, asc, lagna, lagnaD9: Math.floor(asc / (30 / 9)) % 12, planets, moon, houseLord: h => SIGN_LORD[(lagna + h - 1) % 12] };
    c.dasha = vimshottari(moon.lon, ms);
    c.avakhada = {
      varna: SIGN_VARNA[moon.sign], vashya: vashyaOf(moon.lon), yoni: NAK_YONI[moon.nak], gana: NAK_GANA[moon.nak], nadi: NAK_NADI[moon.nak],
      nakLord: DASHA_LORD[moon.nak % 9], rashiLord: SIGN_LORD[moon.sign], syllables: SYLLABLES[moon.nak].split(' ')[moon.pada - 1], allSyllables: SYLLABLES[moon.nak],
    };
    c.doshas = doshas(c);
    c.yogas = yogas(c);
    return c;
  }
  function strength(p) {
    if (p.i >= 7) return ([3, 6, 10, 11].includes(p.house) ? 1 : [8, 12].includes(p.house) ? -1 : 0) + DIG_SCORE[p.dignity] * 0.5;
    let s = DIG_SCORE[p.dignity];
    if ([1, 4, 7, 10, 5, 9].includes(p.house)) s += 1; else if ([6, 8, 12].includes(p.house)) s -= 1;
    if (p.combust) s -= 1;
    return s;
  }
  const strengthLabel = s => s >= 2 ? ['Strong', 'बली'] : s >= 0.5 ? ['Good', 'अच्छा'] : s > -1 ? ['Average', 'मध्यम'] : ['Weak', 'निर्बल'];

  function vimshottari(moonLon, birth) {
    const span = 360 / 27, nak = Math.floor(moonLon / span), frac = (moonLon % span) / span;
    const first = nak % 9, list = [];
    let t = birth - frac * DASHA_YRS[first] * YEAR;
    for (let k = 0; k < 10; k++) {
      const li = (first + k) % 9, lord = DASHA_LORD[li], len = DASHA_YRS[li] * YEAR, md = { lord, start: t, end: t + len, sub: [] };
      let s = t;
      for (let j = 0; j < 9; j++) { const lj = (li + j) % 9, l2 = DASHA_YRS[li] * DASHA_YRS[lj] / 120 * YEAR; md.sub.push({ lord: DASHA_LORD[lj], start: s, end: s + l2 }); s += l2; }
      list.push(md); t += len;
    }
    return { list, balance: (1 - frac) * DASHA_YRS[first] };
  }

  // ---------- Manglik (Kuja) dosha ----------
  // method: 'l' = from Lagna only, 'lm' = Lagna and Moon (default), 'lmv' = Lagna, Moon and Venus
  let MANGLIK_METHOD = 'lm';
  const MANGLIK_METHODS = { l: ['Lagna only', 'केवल लग्न से'], lm: ['Lagna and Moon', 'लग्न व चंद्र से'], lmv: ['Lagna, Moon and Venus', 'लग्न, चंद्र व शुक्र से'] };
  const setManglikMethod = m => { if (MANGLIK_METHODS[m]) MANGLIK_METHOD = m; };
  const M_HOUSES = [1, 2, 4, 7, 8, 12];
  // classical sign exceptions (house counted from the reference point -> Mars signs where that house gives no dosha); sources differ, editable
  const M_SIGN_EXC = { 1: [0], 2: [2, 5], 4: [0, 7], 7: [3, 9], 8: [8, 11], 12: [1, 6] };
  const SN = i => N.RASHI[i][0];
  function manglikInfo(c) {
    const mars = c.planets[2], from = s => ((mars.sign - s + 12) % 12) + 1, use = MANGLIK_METHOD;
    const refs = [['lagna', 'Lagna', 'लग्न', mars.house, true], ['moon', 'Moon', 'चंद्र', from(c.moon.sign), use !== 'l'], ['venus', 'Venus', 'शुक्र', from(c.planets[5].sign), use === 'lmv']]
      .map(([key, en, hi, house, used]) => ({ key, en, hi, house, used, hit: M_HOUSES.includes(house), exc: M_HOUSES.includes(house) && (M_SIGN_EXC[house] || []).includes(mars.sign) }));
    const hits = refs.filter(r => r.used && r.hit), live = hits.filter(r => !r.exc), usedN = refs.filter(r => r.used).length;
    // chart-wide rules that cancel the dosha outright, and rules that only soften it
    const ju = c.planets[4], jAsp = ((mars.house - ju.house + 12) % 12) + 1;
    const voids = [], soft = [];
    if (mars.dignity === 'own') voids.push(['Mars is in its own sign', 'मंगल स्वराशि में']);
    if (mars.dignity === 'exalted') voids.push(['Mars is exalted (Capricorn)', 'मंगल उच्च (मकर)']);
    if ([4, 10].includes(mars.sign)) voids.push(['Mars is in Leo or Aquarius', 'मंगल सिंह या कुंभ में']);
    if (ju.sign === mars.sign) voids.push(['Jupiter is with Mars', 'गुरु मंगल के साथ']);
    else if ([5, 7, 9].includes(jAsp)) soft.push(['Jupiter aspects Mars', 'गुरु की मंगल पर दृष्टि']);
    if (ju.house === 1) soft.push(['Jupiter is in the Lagna', 'गुरु लग्न में']);
    if (c.planets[5].house === 1 || c.planets[5].house === 7) soft.push([`Venus is in house ${c.planets[5].house}`, `शुक्र भाव ${c.planets[5].house} में`]);
    if (c.moon.sign === mars.sign) soft.push(['Moon is with Mars (Chandra-Mangal)', 'चंद्र मंगल के साथ']);
    if ([0, 7, 9].includes(c.lagna) && hits.some(r => r.key === 'lagna')) soft.push(['Mars rules or is exalted in the Lagna sign', 'लग्न राशि मंगल की या मंगल उच्च']);
    for (const r of hits.filter(r => r.exc)) voids.push([`Mars in house ${r.house} from ${r.en} is in ${SN(mars.sign)}, a classical exception`, `${r.hi} से भाव ${r.house} में ${N.RASHI[mars.sign][1]} का मंगल शास्त्रीय अपवाद है`]);
    const status = !hits.length ? 'none' : (!live.length || voids.some(v => !/classical exception/.test(v[0]))) ? 'cancelled' : usedN === 1 ? 'present' : live.length >= 2 ? 'high' : 'mild';
    return { method: use, methodName: MANGLIK_METHODS[use], refs, hits, status, voids, soft, mars };
  }

  function doshas(c) {
    const out = [], moon = c.moon;
    const mi = c.manglik = manglikInfo(c);
    const where = (lang) => mi.hits.map(r => lang ? `${r.hi} से भाव ${r.house}` : `house ${r.house} from ${r.en}`).join(lang ? ', ' : ' and ');
    if (['high', 'mild', 'present'].includes(mi.status)) {
      out.push({ key: 'manglik', en: 'Manglik (Kuja) dosha', hi: 'मांगलिक दोष', level: mi.status, planet: 2,
        text: `Mars is in ${where(0)} (checked from ${mi.methodName[0]}).${mi.soft.length ? ' Softened because ' + mi.soft.map(x => x[0]).join('; ') + '.' : ''}`, cancel: mi.soft.length > 0 });
    }
    const r = c.planets[7].lon, sides = c.planets.slice(0, 7).map(p => norm(p.lon - r) < 180);
    if (sides.every(x => x) || sides.every(x => !x)) out.push({ key: 'kaalsarp', en: 'Kaal Sarp yoga', hi: 'कालसर्प योग', level: 'mild', planet: 7, text: 'All seven planets sit on one side of the Rahu–Ketu axis.' });
    // Sade Sati / Dhaiya from current Saturn transit
    const satNow = Math.floor(sidLon(6, Date.now()) / 30), rel = ((satNow - moon.sign + 12) % 12) + 1;
    if ([12, 1, 2].includes(rel)) out.push({ key: 'sadesati', en: 'Sade Sati (running now)', hi: 'साढ़े साती (चल रही)', level: 'mild', planet: 6, text: `Saturn is transiting ${N.RASHI[satNow][0]}, the ${rel === 12 ? 'first (12th from Moon)' : rel === 1 ? 'second (over the Moon)' : 'third (2nd from Moon)'} phase.` });
    else if ([4, 8].includes(rel)) out.push({ key: 'dhaiya', en: 'Shani Dhaiya (running now)', hi: 'शनि ढैया (चल रही)', level: 'mild', planet: 6, text: `Saturn is transiting the ${rel}th sign from the Moon.` });
    if (c.planets.slice(0, 7).some(p => p.dignity === 'debilitated')) for (const p of c.planets.slice(0, 7).filter(p => p.dignity === 'debilitated')) out.push({ key: 'neecha', en: `${PL[p.i][0]} debilitated`, hi: `${PL[p.i][1]} नीच`, level: 'mild', planet: p.i, text: `${PL[p.i][0]} is in ${N.RASHI[p.sign][0]}, its sign of debilitation.` });
    const sunRahu = c.planets[0].sign === c.planets[7].sign || c.planets[0].sign === c.planets[8].sign;
    if (sunRahu) out.push({ key: 'pitra', en: 'Pitra dosha (indication)', hi: 'पितृ दोष (संकेत)', level: 'mild', planet: 0, text: 'The Sun shares a sign with Rahu or Ketu.' });
    const gm = [0, 8, 9, 17, 18, 26];
    if (gm.includes(moon.nak)) out.push({ key: 'gandmool', en: 'Gand Mool birth', hi: 'गंड मूल जन्म', level: 'mild', planet: 8, text: `Moon in ${N.NAK[moon.nak][0]}; a Gand Mool shanti puja is traditional.` });
    return out;
  }

  function yogas(c) {
    const p = c.planets, out = [], kendra = h => [1, 4, 7, 10].includes(h);
    const fromMoon = x => ((x.sign - c.moon.sign + 12) % 12) + 1;
    if (kendra(fromMoon(p[4]))) out.push({ en: 'Gaja Kesari yoga', hi: 'गजकेसरी योग', text: 'Jupiter is in a kendra from the Moon: wisdom and respect.' });
    if (p[0].sign === p[3].sign) out.push({ en: 'Budhaditya yoga', hi: 'बुधादित्य योग', text: 'Sun and Mercury together: intelligence and communication.' });
    if (p[1].sign === p[2].sign) out.push({ en: 'Chandra-Mangal yoga', hi: 'चंद्र-मंगल योग', text: 'Moon and Mars together: drive for earning.' });
    const MP = { 2: ['Ruchaka', 'रुचक'], 3: ['Bhadra', 'भद्र'], 4: ['Hamsa', 'हंस'], 5: ['Malavya', 'मालव्य'], 6: ['Shasha', 'शश'] };
    for (const k of [2, 3, 4, 5, 6]) if (kendra(p[k].house) && ['own', 'exalted'].includes(p[k].dignity)) out.push({ en: `${MP[k][0]} yoga (Pancha Mahapurusha)`, hi: `${MP[k][1]} योग (पंच महापुरुष)`, text: `${PL[k][0]} is strong in a kendra.` });
    const near = [2, 12].map(h => p.slice(2, 7).some(x => fromMoon(x) === h));
    if (!near[0] && !near[1] && !kendra(fromMoon(p[4]))) out.push({ en: 'Kemadruma yoga', hi: 'केमद्रुम योग', text: 'No planet beside the Moon; steady routines help.', bad: true });
    const l9 = c.houseLord(9), l10 = c.houseLord(10);
    if (p[l9].sign === p[l10].sign && l9 !== l10) out.push({ en: 'Dharma-Karmadhipati yoga', hi: 'धर्म-कर्माधिपति योग', text: 'Lords of the 9th and 10th houses are together: career with purpose.' });
    const l2 = c.houseLord(2), l11 = c.houseLord(11);
    if (p[l2].sign === p[l11].sign && l2 !== l11) out.push({ en: 'Dhana yoga', hi: 'धन योग', text: 'Lords of the 2nd and 11th houses are together.' });
    return out;
  }

  // ---------- matching ----------
  function match(boy, girl) {
    const b = boy.moon, g = girl.moon, ab = boy.avakhada, ag = girl.avakhada;
    const k = [];
    k.push({ key: 'Varna', hi: 'वर्ण', max: 1, pts: (3 - ab.varna) >= (3 - ag.varna) ? 1 : 0, b: VARNA[ab.varna], g: VARNA[ag.varna], about: 'Work temperament' });
    k.push({ key: 'Vashya', hi: 'वश्य', max: 2, pts: VASHYA_PTS[ab.vashya][ag.vashya], b: VASHYA[ab.vashya], g: VASHYA[ag.vashya], about: 'Mutual attraction' });
    const tara = (from, to) => { const c = ((to - from + 27) % 27) + 1, r = c % 9 || 9; return ![3, 5, 7].includes(r); };
    k.push({ key: 'Tara', hi: 'तारा', max: 3, pts: (tara(g.nak, b.nak) ? 1.5 : 0) + (tara(b.nak, g.nak) ? 1.5 : 0), b: N.NAK[b.nak], g: N.NAK[g.nak], about: 'Health and fortune together' });
    k.push({ key: 'Yoni', hi: 'योनि', max: 4, pts: YONI_PTS[ab.yoni][ag.yoni], b: YONI[ab.yoni], g: YONI[ag.yoni], about: 'Physical compatibility' });
    const lb = ab.rashiLord, lg = ag.rashiLord;
    let gm; if (lb === lg) gm = 5; else { const r1 = REL[lb][lg], r2 = REL[lg][lb], s = r1 + r2; gm = r1 === 1 && r2 === 1 ? 5 : s === 1 ? 4 : r1 === 0 && r2 === 0 ? 3 : s === 0 ? 1 : s === -1 ? 0.5 : 0; }
    k.push({ key: 'Graha Maitri', hi: 'ग्रह मैत्री', max: 5, pts: gm, b: PL[lb], g: PL[lg], about: 'Mental wavelength' });
    k.push({ key: 'Gana', hi: 'गण', max: 6, pts: GANA_PTS[ab.gana][ag.gana], b: GANA[ab.gana], g: GANA[ag.gana], about: 'Nature and temperament' });
    const d = ((b.sign - g.sign + 12) % 12) + 1, bad = [2, 12, 5, 9, 6, 8].includes(d);
    k.push({ key: 'Bhakoot', hi: 'भकूट', max: 7, pts: bad ? 0 : 7, b: N.RASHI[b.sign], g: N.RASHI[g.sign], about: 'Family welfare and finances' });
    k.push({ key: 'Nadi', hi: 'नाड़ी', max: 8, pts: ab.nadi === ag.nadi ? 0 : 8, b: NADI[ab.nadi], g: NADI[ag.nadi], about: 'Health and progeny' });
    const total = k.reduce((s, x) => s + x.pts, 0);
    const notes = [];
    if (ab.nadi === ag.nadi) {
      if (b.sign === g.sign && b.nak !== g.nak) notes.push({ ok: true, text: 'Nadi dosha is cancelled: same Moon sign, different nakshatra.' });
      else if (b.nak === g.nak && b.pada !== g.pada) notes.push({ ok: true, text: 'Nadi dosha is softened: same nakshatra, different pada.' });
      else if (lb === lg) notes.push({ ok: true, text: 'Nadi dosha is softened: both Moon signs share the same lord.' });
      else notes.push({ ok: false, text: 'Nadi dosha present (0 of 8). Traditionally a Nadi dosha nivaran puja is advised.' });
    }
    if (bad) {
      if (lb === lg || (REL[lb][lg] === 1 && REL[lg][lb] === 1)) notes.push({ ok: true, text: 'Bhakoot dosha is cancelled: Moon-sign lords are the same or mutual friends.' });
      else notes.push({ ok: false, text: `Bhakoot dosha present (${d}/${14 - d} position).` });
    }
    if (ab.gana !== ag.gana && GANA_PTS[ab.gana][ag.gana] <= 1) notes.push({ ok: false, text: 'Gana dosha: different temperaments (Deva/Manushya with Rakshasa).' });
    const mb = boy.doshas.find(x => x.key === 'manglik'), mg = girl.doshas.find(x => x.key === 'manglik');
    if (mb && mg) notes.push({ ok: true, text: 'Both charts are Manglik, so the Mangal dosha balances out.' });
    else if (mb || mg) notes.push({ ok: !!(mb || mg).cancel, text: `Only the ${mb ? 'boy' : 'girl'} is Manglik${(mb || mg).cancel ? ' (softened in the chart)' : ''}. Your astrologer should review.` });
    else notes.push({ ok: true, text: 'Neither chart is Manglik.' });
    const verdict = total >= 28 ? ['Excellent match', 'उत्तम मिलान', 'good'] : total >= 18 ? ['Acceptable match', 'स्वीकार्य मिलान', 'neutral'] : ['Below the usual 18-point threshold', 'सामान्य सीमा (18) से कम', 'bad'];
    return { koota: k, total, notes, verdict };
  }

  // ---------- gemstones ----------
  const GEM = [
    { en: 'Ruby (Manik)', hi: 'माणिक्य', up: 'Red garnet or red spinel', finger: 'Ring finger', metal: 'Gold or copper', day: 'Sunday, after sunrise', ratti: '3–6' },
    { en: 'Pearl (Moti)', hi: 'मोती', up: 'Moonstone', finger: 'Little finger', metal: 'Silver', day: 'Monday evening', ratti: '4–8' },
    { en: 'Red Coral (Moonga)', hi: 'मूंगा', up: 'Carnelian', finger: 'Ring finger', metal: 'Gold or copper', day: 'Tuesday morning', ratti: '6–10' },
    { en: 'Emerald (Panna)', hi: 'पन्ना', up: 'Peridot or green tourmaline', finger: 'Little finger', metal: 'Gold', day: 'Wednesday morning', ratti: '3–6' },
    { en: 'Yellow Sapphire (Pukhraj)', hi: 'पुखराज', up: 'Yellow topaz or citrine', finger: 'Index finger', metal: 'Gold', day: 'Thursday morning', ratti: '3–6' },
    { en: 'Diamond (Heera)', hi: 'हीरा', up: 'White sapphire, zircon or opal', finger: 'Middle or ring finger', metal: 'Silver or platinum', day: 'Friday morning', ratti: '0.5–1 carat' },
    { en: 'Blue Sapphire (Neelam)', hi: 'नीलम', up: 'Amethyst or iolite', finger: 'Middle finger', metal: 'Silver or panchdhatu', day: 'Saturday evening', ratti: '3–5', caution: 'Wear on trial for a few days first; only after the astrologer approves.' },
    { en: 'Hessonite (Gomed)', hi: 'गोमेद', up: 'Orange zircon', finger: 'Middle finger', metal: 'Silver', day: 'Saturday evening', ratti: '5–8', caution: 'Shadow-planet stone; only after the astrologer approves.' },
    { en: "Cat's Eye (Lehsunia)", hi: 'लहसुनिया', up: 'Tiger eye', finger: 'Little or middle finger', metal: 'Silver', day: 'Thursday or Saturday', ratti: '3–5', caution: 'Shadow-planet stone; only after the astrologer approves.' },
  ];
  const GEM_CLASH = [[0, 6], [0, 5], [0, 7], [1, 7], [1, 8], [1, 6], [4, 5], [4, 3], [2, 3], [2, 6]];

  function gemstones(c) {
    const lordOf = h => c.houseLord(h);
    const houses = l => [...Array(12)].map((_, k) => k + 1).filter(h => lordOf(h) === l);
    const bad = l => houses(l).some(h => [6, 8, 12].includes(h)) && !houses(l).some(h => [1, 5, 9].includes(h));
    const picks = [];
    const add = (planet, role, roleHi, why) => {
      if (picks.some(p => p.planet === planet)) { picks.find(p => p.planet === planet).roles.push(role); return; }
      picks.push({ planet, role, roleHi, roles: [role], why, gem: GEM[planet], p: c.planets[planet] });
    };
    add(lordOf(1), 'Life stone (Lagna lord)', 'जीवन रत्न (लग्नेश)', 'Supports health, confidence and overall direction.');
    add(lordOf(5), 'Lucky stone (5th lord)', 'शुभ रत्न (पंचमेश)', 'Supports intelligence, children and good decisions.');
    add(lordOf(9), 'Fortune stone (9th lord)', 'भाग्य रत्न (नवमेश)', 'Supports luck, dharma and guidance.');
    const md = currentDasha(c);
    if (md && md.lord <= 6 && !bad(md.lord)) add(md.lord, 'Running dasha lord', 'चल रही दशा का स्वामी', 'Supports the planet whose period is running now.');
    for (const x of picks) {
      x.houses = houses(x.planet);
      x.alsoRulesDusthana = houses(x.planet).some(h => [6, 8, 12].includes(h));
      x.weakNote = x.p.strength < 0 ? 'Planet is weak in this chart, so its stone is often recommended.' : x.p.dignity === 'debilitated' ? 'Planet is debilitated; many astrologers prefer mantra over the stone here.' : '';
    }
    const avoid = [];
    for (let i = 0; i <= 6; i++) if (bad(i) && !picks.some(p => p.planet === i)) avoid.push({ planet: i, gem: GEM[i], why: `Rules house ${houses(i).join(' and ')} (6th, 8th or 12th) for this Lagna.` });
    const clashes = [];
    for (const [a, b2] of GEM_CLASH) if (picks.some(p => p.planet === a) && picks.some(p => p.planet === b2)) clashes.push([a, b2]);
    return { picks, avoid, clashes };
  }
  function currentDasha(c, at) {
    const t = at || Date.now();
    const md = c.dasha.list.find(x => t >= x.start && t < x.end); if (!md) return null;
    return { lord: md.lord, md, ad: md.sub.find(x => t >= x.start && t < x.end) };
  }

  // ---------- dasha meanings (in-house wording; general tendencies, not certainties) ----------
  const DASHA_THEME = [

  const TONE = [['Favourable', 'अनुकूल', 'good'], ['Mixed', 'मिश्रित', 'neutral'], ['Needs care', 'सावधानी', 'bad']];

  // houses a planet "gives results of": houses it owns plus the house it sits in (Rahu/Ketu: their house plus their sign lord's houses)
  function dashaHouses(c, lord) {
    const p = c.planets[lord];
    const ownerOf = i => OWN[i].map(s => ((s - c.lagna + 12) % 12) + 1);
    const owns = lord >= 7 ? [] : ownerOf(lord);
    const via = lord >= 7 ? SIGN_LORD[p.sign] : null;
    return { owns, sits: p.house, via, viaOwns: via != null ? ownerOf(via) : [] };
  }
  function dashaScore(c, lord) {
    const h = dashaHouses(c, lord), all = h.owns.length ? h.owns : h.viaOwns;
    let s = c.planets[lord].strength;
    if (all.some(x => [1, 5, 9].includes(x))) s += 1;
    if (all.length && all.every(x => [6, 8, 12].includes(x))) s -= 1;
    if ([6, 8, 12].includes(h.sits)) s -= 0.5;
    if (lord >= 7 && via(c, lord) != null) s += c.planets[via(c, lord)].strength * 0.3;
    return s;
  }
  const via = (c, lord) => lord >= 7 ? SIGN_LORD[c.planets[lord].sign] : null;
  const toneOf = s => s >= 1 ? TONE[0] : s > -0.75 ? TONE[1] : TONE[2];
  const listJoin = (a, and) => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ` ${and} ` + a[a.length - 1];

  function dashaMeaning(c, lord) {
    const T = DASHA_THEME[lord], h = dashaHouses(c, lord), tone = toneOf(dashaScore(c, lord)), sl = strengthLabel(c.planets[lord].strength);
    const hs = [...new Set([...h.owns, h.sits, ...h.viaOwns])].sort((a, b) => a - b);
    const ownTxt = (o, lang) => o.map(x => `${x}${lang ? '' : ''} (${HOUSE_TOPIC[x][lang]})`);
    let en = `In this chart ${PL[lord][0]} `, hi = `इस कुंडली में ${PL[lord][1]} `;
    if (lord < 7) { en += `rules house ${listJoin(ownTxt(h.owns, 0), 'and')} and sits in house ${h.sits} (${HOUSE_TOPIC[h.sits][0]}).`; hi += `भाव ${listJoin(ownTxt(h.owns, 1), 'व')} का स्वामी है और भाव ${h.sits} (${HOUSE_TOPIC[h.sits][1]}) में बैठा है।`; }
    else { en += `sits in house ${h.sits} (${HOUSE_TOPIC[h.sits][0]}) and works through its sign lord ${PL[h.via][0]}, who rules house ${listJoin(ownTxt(h.viaOwns, 0), 'and')}.`; hi += `भाव ${h.sits} (${HOUSE_TOPIC[h.sits][1]}) में है और अपने राशि स्वामी ${PL[h.via][1]} के माध्यम से फल देता है, जो भाव ${listJoin(ownTxt(h.viaOwns, 1), 'व')} का स्वामी है।`; }
    const res = tone === TONE[0] ? ['so these areas tend to move forward well', 'इसलिए इन क्षेत्रों में प्रायः अच्छी प्रगति होती है'] : tone === TONE[1] ? ['so results in these areas tend to be mixed: some gains, some effort', 'इसलिए इन क्षेत्रों में मिश्रित फल: कुछ लाभ, कुछ परिश्रम'] : ['so these areas need more patience and the remedies for this planet help', 'इसलिए इन क्षेत्रों में धैर्य चाहिए और इस ग्रह के उपाय सहायक हैं'];
    en += ` ${PL[lord][0]} is ${sl[0].toLowerCase()} here, ${res[0]}.`; hi += ` यहाँ ${PL[lord][1]} ${sl[1]} है, ${res[1]}।`;
    return { lord, tone, short: T.short, theme: [T.en, T.hi], good: T.good, care: T.care, houses: hs, chart: [en, hi], topics: hs.map(x => HOUSE_TOPIC[x]) };
  }
  function dashaPair(c, md, ad) {
    if (md === ad) return [`${PL[md][0]} antardasha inside its own mahadasha gives the purest results of ${PL[md][0]}.`, `${PL[md][1]} की अपनी महादशा में अपनी अंतर्दशा, ${PL[md][1]} का पूरा फल देती है।`];
    const d = ((c.planets[ad].house - c.planets[md].house + 12) % 12) + 1;
    const rel = md < 7 && ad < 7 ? REL[md][ad] : 0;
    let en, hi;
    if ([6, 8].includes(d)) { en = `${PL[ad][0]} sits 6/8 from ${PL[md][0]}, so this sub-period can bring some friction or obstacles; go steady.`; hi = `${PL[ad][1]}, ${PL[md][1]} से 6/8 स्थिति में है, इसलिए इस अंतर्दशा में कुछ रुकावटें संभव; धैर्य रखें।`; }
    else if ([1, 5, 9, 4, 7, 10].includes(d) && rel >= 0) { en = `${PL[ad][0]} and ${PL[md][0]} are well placed to each other, so this sub-period usually supports the main dasha.`; hi = `${PL[ad][1]} और ${PL[md][1]} की परस्पर स्थिति अच्छी है, इसलिए यह अंतर्दशा प्रायः महादशा को सहयोग देती है।`; }
    else if (rel < 0) { en = `${PL[ad][0]} is not a natural friend of ${PL[md][0]}, so results are mixed; plan carefully.`; hi = `${PL[ad][1]}, ${PL[md][1]} का नैसर्गिक मित्र नहीं है, इसलिए फल मिश्रित; सोच-समझकर योजना बनाएँ।`; }
    else { en = `${PL[ad][0]} works with ${PL[md][0]} in a neutral way; results depend on effort.`; hi = `${PL[ad][1]} और ${PL[md][1]} का संबंध सामान्य है; फल परिश्रम पर निर्भर।`; }
    return [en, hi];
  }
  // full reading of the period running at a date: mahadasha, antardasha, how they combine, and the next antardasha
  function dashaReading(c, at) {
    const now = currentDasha(c, at); if (!now) return null;
    const i = now.md.sub.indexOf(now.ad), mdIdx = c.dasha.list.indexOf(now.md);
    const next = now.md.sub[i + 1] ? { md: now.lord, ad: now.md.sub[i + 1] } : c.dasha.list[mdIdx + 1] ? { md: c.dasha.list[mdIdx + 1].lord, ad: c.dasha.list[mdIdx + 1].sub[0] } : null;
    return { now, md: dashaMeaning(c, now.lord), ad: dashaMeaning(c, now.ad.lord), pair: dashaPair(c, now.lord, now.ad.lord), next: next && { md: next.md, lord: next.ad.lord, start: next.ad.start, end: next.ad.end, meaning: dashaMeaning(c, next.ad.lord) } };
  }

  function finderResults() {

    const dlabel = D => new Date(Date.UTC(D.y, D.m - 1, D.d)).toLocaleDateString(lang === 'hi' ? 'hi-IN' : 'en-IN', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });

    const top = best.length ? `<div class="box"><h3>${lang === 'hi' ? 'सबसे अच्छे समय' : 'Best windows'}</h3><div class="chips">${best.map(w => `<span class="chip good">${dlabel(w.day)} · <span class="t">${P.fmt(w.start, state.place.tz, w.day.sunrise)}–${P.fmt(w.end, state.place.tz, w.day.sunrise)}</span> · ${w.score}</span>`).join('')}</div></div>` : `<p class="note">${lang === 'hi' ? 'इस अवधि में कोई उपयुक्त समय नहीं मिला।' : 'No suitable window in this range. Try a longer range.'}</p>`;

  const ZGLYPH = ['♈', '♉', '♊', '♋', '♌', '♍', '♎', '♏', '♐', '♑', '♒', '♓'].map(g => g + '︎');
  // symbols as used by most Indian software: * retrograde, ^ combust, ° vargottama, ↑ exalted, ↓ debilitated
  const psym = p => (p.retro && p.i < 7 ? '*' : '') + (p.combust ? '^' : '') + (p.vargottama ? '°' : '') + (p.dignity === 'exalted' ? '↑' : p.dignity === 'debilitated' ? '↓' : '');
  const pAbbr = i => lang === 'hi' ? ['सू', 'चं', 'मं', 'बु', 'गु', 'शु', 'श', 'रा', 'के'][i] : K.PL[i][2];
  function chartItems(c, kind) {
    const lag = kind === 'd9' ? c.lagnaD9 : kind === 'moon' ? c.moon.sign : c.lagna;
    const items = [{ sign: lag, txt: lang === 'hi' ? 'ल' : 'As', cls: 'pcAs' }];
    for (const p of c.planets) items.push({ sign: kind === 'd9' ? p.d9 : p.sign, txt: pAbbr(p.i) + (kind === 'd9' ? '' : psym(p)), cls: 'pc' + p.i });
    return { lag, items };
  }
  function chartSVG(c, kind, title) {
    const { lag, items } = chartItems(c, kind);
    const tspans = (arr, x, y, per) => {
      const lines = []; for (let i = 0; i < arr.length; i += per) lines.push(arr.slice(i, i + per));
      return lines.map((ln, li) => `<text x="${x}" y="${y + (li - (lines.length - 1) / 2) * 17}" class="pl">${ln.map((it, j) => `<tspan class="${it.cls}"${j ? ' dx="5"' : ''}>${it.txt}</tspan>`).join('')}</text>`).join('');
    };
    let body = '';
    if (look.chart === 'south') {
      body = `<rect x="0" y="0" width="400" height="400" class="ln"/><path d="M100 0V400M300 0V400M0 100H400M0 300H400M200 0V100M200 300V400M0 200H100M300 200H400" class="ln"/><rect x="100" y="100" width="200" height="200" class="lnf" style="fill:var(--sheet)"/>`;
      for (let s = 0; s < 12; s++) {
        const [cx, cy] = SOUTH_CELL[s], x0 = cx * 100, y0 = cy * 100, here = items.filter(it => it.sign === s);
        body += `<text x="${x0 + 14}" y="${y0 + 14}" class="sgn">${lang === 'hi' ? SIGN_HI[s] : SIGN_ABBR[s]}</text>`;
        if (s === lag) body += `<path d="M${x0 + 72} ${y0}L${x0 + 100} ${y0 + 28}" class="ln"/>`;
        body += tspans(here, x0 + 50, y0 + 56, 2);
      }
      body += `<text x="200" y="196" class="ctr">${title}</text><text x="200" y="218" class="ctr" style="font-size:11px">${hiEn('South Indian', 'दक्षिण भारतीय')}</text>`;
    } else {
      body = `<rect x="0" y="0" width="400" height="400" class="ln"/><path d="M0 0L400 400M400 0L0 400M200 0L400 200L200 400L0 200Z" class="ln"/>`;
      for (let h = 0; h < 12; h++) {
        const [x, y, nx, ny] = HOUSE_POS[h], sign = (lag + h) % 12, here = items.filter(it => it.sign === sign);
        body += `<text x="${nx}" y="${ny}" class="sgn">${sign + 1}</text>`;
        body += tspans(here, x, y, [0, 3, 6, 9].includes(h) ? 3 : 2);
      }
    }
    return `<svg viewBox="-4 -4 408 408" class="nchart" role="img" aria-label="${esc(title)}">${body}</svg>`;
  }
  function chartBox(c) {
    const kind = state.chartKind || 'd1';
    const titles = { d1: hiEn('Lagna (D1)', 'लग्न कुंडली'), d9: hiEn('Navamsa (D9)', 'नवांश'), moon: hiEn('Chandra (Moon)', 'चंद्र कुंडली') };
    const degs = kind === 'd9' ? '' : `<div class="degs"><span><b class="pcAs">${lang === 'hi' ? 'ल' : 'La'}</b>${dmsFull(c.asc)}</span>${c.planets.map(p => `<span><b class="pc${p.i}">${pAbbr(p.i)}</b>${dmsFull(p.lon)}${psym(p)}</span>`).join('')}</div>`;
    return `<div class="chartbox"><div class="seg" role="group">${Object.entries(titles).map(([k, l]) => `<button type="button" data-ck="${k}" aria-pressed="${k === kind}">${l}</button>`).join('')}</div>
      ${chartSVG(c, kind, titles[kind])}${degs}
      <span class="legend">* ${hiEn('retrograde', 'वक्री')} · ^ ${hiEn('combust', 'अस्त')} · ° ${hiEn('vargottama', 'वर्गोत्तम')} · ↑ ${hiEn('exalted', 'उच्च')} · ↓ ${hiEn('debilitated', 'नीच')}</span></div>`;
  }
  const dmsFull = x => { x = x % 30; const d = Math.floor(x), mm = Math.floor((x - d) * 60), s = Math.floor(((x - d) * 60 - mm) * 60); return `${String(d).padStart(2, '0')}°${String(mm).padStart(2, '0')}′${String(s).padStart(2, '0')}″`; };
  const bar = s => { const pct = Math.max(4, Math.min(100, (s + 3) / 6.5 * 100)); const cls = s >= 1 ? 'good' : s >= -0.5 ? 'neutral' : 'bad'; return `<span class="sbar"><span class="${cls}" style="width:${pct}%"></span></span>`; };

  function dashaMeaningHtml(m) {
    return `<div class="dmean"><p>${hiEn(m.theme[0], m.theme[1])}</p><p>${hiEn(m.chart[0], m.chart[1])}</p>
      <div class="dgc"><div><span class="dot good"></span><b>${hiEn('Can bring', 'शुभ फल')}</b> ${hiEn(m.good[0], m.good[1])}</div><div><span class="dot neutral"></span><b>${hiEn('Take care', 'सावधानी')}</b> ${hiEn(m.care[0], m.care[1])}</div></div></div>`;
  }
  function dashaNowHtml(c, tz) {
    const r = K.dashaReading(c); if (!r) return '';
    const now = r.now;
    return `<div class="box"><h3>${hiEn('What the running dasha means now', 'अभी चल रही दशा का फल')}</h3>
      <div class="summary"><div><span class="lbl">${hiEn('Mahadasha', 'महादशा')}</span><b>${pn(now.lord)}</b> <span class="note t">${hiEn('until', 'तक')} ${fdate(now.md.end, tz)}</span></div><div><span class="lbl">${hiEn('Antardasha', 'अंतर्दशा')}</span><b>${pn(now.ad.lord)}</b> <span class="note t">${fdate(now.ad.start, tz)} – ${fdate(now.ad.end, tz)}</span></div><div><span class="lbl">${hiEn('Overall', 'कुल मिलाकर')}</span><span class="chip ${r.md.tone[2]}">${hiEn(r.md.tone[0], r.md.tone[1])}</span></div></div>
      <h4>${pn(now.lord)} ${hiEn('mahadasha', 'महादशा')}</h4>${dashaMeaningHtml(r.md)}
      <h4>${pn(now.ad.lord)} ${hiEn('antardasha', 'अंतर्दशा')} <span class="chip ${r.ad.tone[2]} sm">${hiEn(r.ad.tone[0], r.ad.tone[1])}</span></h4><div class="dmean"><p>${hiEn(r.ad.short[0], r.ad.short[1])}: ${hiEn(r.ad.chart[0], r.ad.chart[1])}</p><p>${hiEn(r.pair[0], r.pair[1])}</p></div>
      ${r.next ? `<p class="note"><b>${hiEn('Next', 'अगली')}:</b> ${pn(r.next.md)}–${pn(r.next.lord)} ${hiEn('from', 'से')} ${fdate(r.next.start, tz)} · ${hiEn(r.next.meaning.short[0], r.next.meaning.short[1])} <span class="chip ${r.next.meaning.tone[2]} sm">${hiEn(r.next.meaning.tone[0], r.next.meaning.tone[1])}</span></p>` : ''}
      <p class="note">${hiEn('General tendencies from the dasha lord\'s nature, the houses it rules and occupies, and its strength. Transits and the astrologer\'s judgement refine this; nothing here is certain.', 'दशा स्वामी का स्वभाव, उसके भाव और बल से सामान्य संकेत। गोचर व ज्योतिषी का विवेक इसे और स्पष्ट करते हैं; कुछ भी निश्चित नहीं।')}</p></div>`;
  }
  // the form alone, until the details are submitted
  function emptyView(title) {
    return `${birthForm('client', title)}<div class="box empty"><p>${hiEn('Enter the birth details above and press <b>Submit</b>. The results will appear here.', 'ऊपर जन्म विवरण भरें और <b>सबमिट</b> दबाएँ। परिणाम यहाँ दिखेंगे।')}</p><p class="note">${hiEn('Or start typing a name to pick a saved client.', 'या सहेजा जातक चुनने के लिए नाम लिखें।')}</p></div>`;
  }
  // ---- Ask a question about this kundli ----
  function askBox(c, tz) {
    const A = state.ask || {}, rec = people.client.id && Store.get(people.client.id), past = (rec && rec.qa) || [];
    const chips = Object.keys(K.ISSUES).map(k => `<button type="button" class="chip${A.key === k ? ' good' : ''}" data-askk="${k}">${hiEn(K.ISSUES[k].en, K.ISSUES[k].hi)}</button>`).join('');

    if (A.need) ans = `<p class="note">${hiEn('Which area is this question about? Pick one below.', 'यह प्रश्न किस क्षेत्र का है? नीचे से चुनें।')}</p>`;
    else if (A.key) {

      const win = r.windows.length ? `<ul>${r.windows.map(w => `<li><b>${pn(w.md)}–${pn(w.ad)}</b> <span class="t">${fdate(w.start, tz)} – ${fdate(w.end, tz)}</span></li>`).join('')}</ul>` : `<p class="note">${hiEn('No period in the next ten years is strongly linked to this area; remedies and transits matter more here.', 'अगले दस वर्षों में कोई दशा इस क्षेत्र से विशेष रूप से नहीं जुड़ी; उपाय व गोचर अधिक महत्वपूर्ण।')}</p>`;
      ans = `<div class="answer">${A.q ? `<p class="aq">“${esc(A.q)}”</p>` : ''}
        <h4>${hiEn(r.issue.en, r.issue.hi)} <span class="chip ${r.label[2]} sm">${hiEn(r.label[0], r.label[1])}</span></h4>

        <h4>${hiEn('Most supportive periods (next 10 years)', 'सबसे अनुकूल समय (अगले 10 वर्ष)')}</h4>${win}
        <h4>${hiEn('What helps', 'क्या सहायक है')}</h4><ul>${r.focus.map(f => `<li><b>${pn(f.planet)}</b>: ${esc(f.r.mantra)} (${f.r.count.toLocaleString('en-IN')}) · ${esc(f.r.day)} · ${hiEn('daan', 'दान')}: ${esc(f.r.daan)}</li>`).join('')}<li>${esc(r.tip)}</li></ul>
        <p class="note">${hiEn('Worked out from this chart by fixed rules (houses, their lords, natural indicators, dasha periods). It is traditional guidance for the astrologer to discuss, not a certainty; for health, money and legal matters always take professional advice too.', 'यह उत्तर इस कुंडली से निश्चित नियमों (भाव, भावेश, कारक, दशा) से बना है। यह पारंपरिक मार्गदर्शन है, निश्चितता नहीं; स्वास्थ्य, धन व कानूनी मामलों में विशेषज्ञ सलाह भी लें।')}</p></div>`;
    }
    return `<div class="box askbox" id="askBox"><h3>${hiEn('Ask a question about this kundli', 'इस कुंडली के बारे में प्रश्न पूछें')}</h3>
      <form class="askrow" id="askForm"><input id="askIn" value="${esc(A.q || '')}" maxlength="200" placeholder="${hiEn('e.g. When will I get married? Will I go abroad? Naukri kab lagegi?', 'जैसे: शादी कब होगी? विदेश जाने का योग है?')}" autocomplete="off"><button type="submit" class="btn">${hiEn('Ask', 'पूछें')}</button></form>
      <div class="chips askchips">${chips}</div>${ans}
      ${past.length ? `<details class="askpast"${state.askOpen ? ' open' : ''}><summary>${hiEn('Earlier questions', 'पिछले प्रश्न')} (${past.length})</summary><div class="list">${past.map((x, i) => `<div class="it"><span><button type="button" class="linkbtn" data-askp="${i}">${esc(x.q || hiEn(K.ISSUES[x.key].en, K.ISSUES[x.key].hi))}</button></span><span class="askdel"><span class="note">${stamp(x.at)}</span><button type="button" class="btn ghost sm" data-askdel="${i}" aria-label="${hiEn('Delete this question', 'यह प्रश्न हटाएँ')}" title="${hiEn('Delete', 'हटाएँ')}">✕</button></span></div>`).join('')}</div>${past.length > 1 ? `<div style="text-align:right;margin-top:6px"><button type="button" class="btn ghost sm" id="askClear">${hiEn('Delete all questions', 'सभी प्रश्न हटाएँ')}</button></div>` : ''}</details>` : ''}</div>`;
  }
  function askSave(q, key) {
    const rec = people.client.id && Store.get(people.client.id); if (!rec) return;

  function bindAsk() {
    const f = $('askForm'); if (!f) return;

    document.querySelectorAll('[data-askk]').forEach(b => b.onclick = () => { const q = $('askIn').value.trim(), key = b.dataset.askk; state.ask = { q: state.ask && state.ask.need ? q : (q && K.classifyQuestion(q) === key ? q : ''), key }; askSave(state.ask.q, key); go(); });
    const det = document.querySelector('.askpast'); if (det) det.ontoggle = () => { state.askOpen = det.open; };

    document.querySelectorAll('[data-askp]').forEach(b => b.onclick = () => { const rec = Store.get(people.client.id), x = rec.qa[+b.dataset.askp]; state.ask = { q: x.q, key: x.key }; go(); });
  }

    const yog = c.yogas.length ? c.yogas.map(y => `<div class="it"><span><span class="dot ${y.bad ? 'neutral' : 'good'}"></span><b>${hiEn(y.en, y.hi)}</b><br><span class="note">${esc(y.text)}</span></span></div>`).join('') : `<p class="note">${hiEn('None of the listed yogas is formed.', 'सूचीबद्ध योगों में से कोई नहीं।')}</p>`;
    const areas = Object.keys(K.ISSUES).map(k => { const a = K.issueAnalysis(c, k); return `<button type="button" class="area" data-issue="${k}"><span>${hiEn(a.issue.en, a.issue.hi)}</span><span class="chip ${a.label[2]} sm">${hiEn(a.label[0], a.label[1])}</span></button>`; }).join('');

      ${isSample('client') ? `<p class="note">${hiEn('Example client shown. Enter real birth details above to check any kundli.', 'उदाहरण दिखाया गया है। अपना विवरण भरें।')}</p>` : ''}
      <div class="hero"><span class="glyph" aria-hidden="true">${ZGLYPH[mo.sign]}</span><div><h2>${esc(p.name)}</h2><div class="meta">${fdate(c.ms, tz)} · ${p.time} · ${esc(place)}</div>
        <div class="chips" style="margin-top:8px"><span class="chip">${hiEn('Lagna', 'लग्न')} ${nm(N.RASHI[c.lagna])}</span><span class="chip">${hiEn('Rashi', 'राशि')} ${nm(N.RASHI[mo.sign])}</span><span class="chip">${nm(N.NAK[mo.nak])} ${mo.pada}</span>${c.doshas.slice(0, 2).map(d => `<span class="chip ${d.cancel ? 'neutral' : 'bad'}">${hiEn(d.en, d.hi)}</span>`).join('')}${c.yogas.slice(0, 2).map(y => `<span class="chip good">${hiEn(y.en, y.hi)}</span>`).join('')}</div></div></div>
      <div class="summary">
        <div><span class="lbl">${hiEn('Lagna', 'लग्न')}</span><b>${nm(N.RASHI[c.lagna])}</b> <span class="note t">${degStr(c.asc % 30)}</span></div>
        <div><span class="lbl">${hiEn('Rashi (Moon)', 'राशि')}</span><b>${nm(N.RASHI[mo.sign])}</b></div>
        <div><span class="lbl">${hiEn('Nakshatra', 'नक्षत्र')}</span><b>${nm(N.NAK[mo.nak])}</b> <span class="note">${hiEn('pada', 'चरण')} ${mo.pada}</span></div>
        <div><span class="lbl">${hiEn('Running dasha', 'चल रही दशा')}</span><b>${now ? `${pn(now.lord)}–${pn(now.ad.lord)}` : '—'}</b></div>

      </div>
      ${askBox(c, tz)}
      ${(() => { const items = K.remedyItems(c); return `<div class="box"><h3>${hiEn('Key remedies', 'मुख्य उपाय')}</h3><p class="note">${hiEn('The most important remedies for this chart. Tap “Alternative remedy” if the first one does not suit the client.', 'इस कुंडली के सबसे ज़रूरी उपाय। पहला उपाय उपयुक्त न हो तो “दूसरा उपाय” दबाएँ।')}</p>

  // ================= CLIENT REGISTER (saved in this browser and synced to the account) =================
  const Store = {
    clients: [], col: null,
    init() { try { this.clients = JSON.parse(localStorage.getItem('pm-clients') || '[]'); } catch (e) { this.clients = []; } },
    keep() { try { localStorage.setItem('pm-clients', JSON.stringify(this.clients)); } catch (e) {} },
    get(id) { return this.clients.find(x => x.id === id); },
    save(rec) { rec.updated = Date.now(); if (!rec.created) rec.created = rec.updated; const i = this.clients.findIndex(x => x.id === rec.id); if (i < 0) this.clients.unshift(rec); else this.clients[i] = rec; this.keep(); if (this.col) this.col.doc(rec.id).set(JSON.parse(JSON.stringify(rec))).catch(() => {}); },
    remove(id) { this.clients = this.clients.filter(x => x.id !== id); this.keep(); if (this.col) this.col.doc(id).delete().catch(() => {}); },
    // own server (Laravel): window.KUNDLI_API = { url, csrf }
    apiCol(api) {
      const call = (m, path, body) => fetch(api.url + path, { method: m, credentials: 'same-origin', headers: { 'Content-Type': 'application/json', Accept: 'application/json', 'X-CSRF-TOKEN': api.csrf, 'X-Requested-With': 'XMLHttpRequest' }, body: body ? JSON.stringify(body) : undefined }).then(r => { if (!r.ok) throw new Error(r.status); return r.status === 204 ? null : r.json(); });
      return { get: () => call('GET', '').then(list => ({ docs: list.map(d => ({ id: d.id, exists: true, data: () => d })) })), doc: id => ({ set: rec => call('PUT', '/' + encodeURIComponent(id), rec), delete: () => call('DELETE', '/' + encodeURIComponent(id)) }) };
    },
    async connect() {
      if (window.KUNDLI_API) {
        try {
          this.col = this.apiCol(window.KUNDLI_API);
          const snap = await this.col.get(), remote = {};
          snap.docs.forEach(d => { remote[d.id] = d.data(); });
          const merged = { ...remote };
          for (const r of this.clients) if (!merged[r.id] || (merged[r.id].updated || 0) < (r.updated || 0)) { merged[r.id] = r; this.col.doc(r.id).set(r).catch(() => {}); }
          this.clients = Object.values(merged).sort((a, b) => (b.updated || 0) - (a.updated || 0)); this.keep();
          storeNote = 'server'; softRender();
        } catch (e) {}
        return;
      }
    },
  };
  let storeNote = 'browser', suppressRead = false;
  function clearAllData() {
    for (const r of [...Store.clients]) Store.remove(r.id);
    try { DATA_KEYS.forEach(k => localStorage.removeItem(k)); } catch (e) {}

    numx = { mobile: '', vehicle: '', tryName: '', account: '', sys: numx.sys || 'chaldean', sample: { mobiles: [], vehicles: [], names: [], accounts: [] } };

  const canRegister = p => p.name && p.name !== '—' && !/^sample:/i.test(p.name);
  function registerPerson(k) {
    const p = people[k]; if (!canRegister(p)) return;
    let rec = p.id && Store.get(p.id);
    if (rec && nname(rec.name) !== nname(p.name)) rec = null;

    const id = rec ? rec.id : 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  // type-ahead on the name box: pick a saved client to load their details
  function attachPeople(input, list, k) {
    let res = [], act = -1;
    const close = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); act = -1; };
    const draw = () => {
      const q = nname(input.value); if (!q) { close(); return; }
      res = Store.clients.filter(x => q.split(' ').every(t => nname(x.name).split(' ').some(w => w.startsWith(t)) || nname(x.name).includes(q))).slice(0, 8);
      if (!res.length) { close(); return; }
      list.innerHTML = `<div class="sempty">${hiEn('Saved clients', 'सहेजे गए जातक')}</div>` + res.map((r, i) => `<div role="option" id="${list.id}-${i}" data-i="${i}" aria-selected="${i === act}"><span class="sn">${esc(r.name)}</span><span class="ss">${r.date.split('-').reverse().join('-')} · ${r.time} · ${esc(placeLabel(r.place))}</span><button type="button" class="st iconx" data-rm="${esc(r.id)}" aria-label="${hiEn('Delete client', 'जातक हटाएँ')}" title="${hiEn('Delete client', 'जातक हटाएँ')}">✕</button></div>`).join('');
      list.hidden = false; input.setAttribute('aria-expanded', 'true');
    };
    const pick = i => { const r = res[i]; close(); suppressRead = true; if (Store.get(r.id)) Store.save(Store.get(r.id)); input.value = r.name; people[k] = { id: r.id, name: r.name, gender: r.gender, date: r.date, time: r.time, place: r.place, kg: r.kg || undefined, ready: true }; delete draft[k]; state.dmd = null; state.ask = null; savePerson(k); render(); setTimeout(() => { suppressRead = false; }, 0); };
    input.addEventListener('input', draw);
    input.addEventListener('keydown', e => {
      if (list.hidden) return;

  function bindNumero() {
    document.querySelectorAll('[data-nsub]').forEach(b => b.onclick = () => { state.numSub = b.dataset.nsub; render(); });

    const ai = $('acctIn');
    if (ai) {
      let raw = '';
      const show = () => { ai.value = NU.maskNum(raw); };
      ai.addEventListener('input', () => {
        const v = ai.value, shown = NU.maskNum(raw);
        if (v.length < shown.length) raw = raw.slice(0, Math.max(0, raw.length - (shown.length - v.length)));
        else raw += v.slice(shown.length).replace(/\D/g, '');
        if (v.length === shown.length && v !== shown) raw = raw.slice(0, -4) + v.slice(-4).replace(/\D/g, '');
        raw = raw.slice(0, 20); show();
      });

        e.preventDefault(); const r = NU.account(raw, numCore()); raw = ''; ai.value = '';

        const { len, total, reduced, rating, last, lastRating, badDigits, fills, score, verdict, mask } = r, L = lists();
        L.accounts = [{ mask, len, total, reduced, rating, last, lastRating, badDigits, fills, score, verdict }, ...L.accounts.filter(x => x.mask !== mask)].slice(0, 30);
        saveLists(L); numx.account = mask; saveNumx(); render();

    st.setProperty('color-scheme', dark ? 'dark' : 'light');
  }
  function saveLook() { try { localStorage.setItem('pm-look', JSON.stringify(look)); } catch (e) {} applyLook(); renderDrawer(); sizeBtns(); render(); }
  if (mq && mq.addEventListener) mq.addEventListener('change', () => { if (look.mode === 'auto') applyLook(); });
  new MutationObserver(() => { if (look.mode === 'auto') applyLook(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function renderDrawer() {
    const d = $('lookPanel'); if (!d || d.hidden) return;
    const dark = isDark();
    d.innerHTML = `<div class="dh"><h2>${hiEn('Look & feel', 'रूप व रंग')}</h2><button type="button" class="btn ghost" id="lookClose">${hiEn('Done', 'बंद करें')}</button></div>
      <section><span class="lbl">${hiEn('Theme', 'थीम')}</span><div class="themes">${Object.entries(THEMES).map(([k, t]) => { const v = dark ? t.dark : t.light; return `<button type="button" class="themecard" data-theme-key="${k}" aria-pressed="${look.theme === k}">
        <span class="pv" style="display:block;background:radial-gradient(60px 40px at 20% 0%, ${v[8]}55, transparent), linear-gradient(135deg, ${v[0]}, ${v[1]})"><i style="left:10px;background:${v[8]}"></i><i style="left:30px;background:${v[9]}"></i><i style="left:50px;background:${v[7]}"></i></span>
        <span class="tn">${hiEn(t.en, t.hi)}</span></button>`; }).join('')}</div></section>
      <section><span class="lbl">${hiEn('Accent colour', 'मुख्य रंग')}</span><div class="swatches">
        <button type="button" class="swatch" data-accent="" aria-pressed="${!look.accent}" title="${hiEn('Theme default', 'थीम का रंग')}" style="background:linear-gradient(135deg, ${(dark ? THEMES[look.theme].dark : THEMES[look.theme].light)[8]}, ${(dark ? THEMES[look.theme].dark : THEMES[look.theme].light)[9]})"></button>
        ${ACCENTS.map(([n, c]) => `<button type="button" class="swatch" data-accent="${c}" aria-pressed="${look.accent === c}" title="${n}" aria-label="${n}" style="background:${c}"></button>`).join('')}
        <label class="note" style="display:flex;gap:6px;align-items:center">${hiEn('Custom', 'अपना')} <input type="color" id="accentPick" value="${look.accent || '#f5b942'}"></label></div></section>
      <section><span class="lbl">${hiEn('Mode', 'मोड')}</span><div class="seg" role="group">${[['auto', hiEn('Auto', 'स्वतः')], ['light', hiEn('Light', 'हल्का')], ['dark', hiEn('Dark', 'गहरा')]].map(([k, l]) => `<button type="button" data-mode="${k}" aria-pressed="${look.mode === k}">${l}</button>`).join('')}</div></section>
      <section><span class="lbl">${hiEn('Chart style', 'कुंडली शैली')}</span><div class="seg" role="group">${[['north', hiEn('North Indian', 'उत्तर भारतीय')], ['south', hiEn('South Indian', 'दक्षिण भारतीय')]].map(([k, l]) => `<button type="button" data-chart="${k}" aria-pressed="${look.chart === k}">${l}</button>`).join('')}</div></section>
      <section><span class="lbl">${hiEn('Text size', 'अक्षर का आकार')}</span><div class="seg" role="group">${[[-1, 'A−'], [0, 'A'], [1, 'A+']].map(([k, l]) => `<button type="button" data-size="${k}" aria-pressed="${k === 0 && look.size === 15}">${l}</button>`).join('')}</div> <span class="note">${look.size}px</span></section>
      <section><span class="lbl">${hiEn('Saved data', 'सहेजा गया डेटा')}</span><p class="note">${hiEn(`${Store.clients.length} saved client${Store.clients.length === 1 ? '' : 's'}, with their tried names, mobile, vehicle and account checks.`, `${Store.clients.length} सहेजे गए जातक।`)}</p><button type="button" class="btn ghost" id="clearData">🗑 ${hiEn('Delete all saved clients and searches', 'सभी सहेजा डेटा हटाएँ')}</button> <span class="note" id="clearMsg" role="status"></span></section>
      <button type="button" class="btn ghost" id="lookReset">${hiEn('Reset to default', 'डिफ़ॉल्ट पर लौटें')}</button>
      <p class="note">${hiEn('Your choice is saved in this browser. In the product, each astrologer could also set their brand colours for reports.', 'आपकी पसंद इस ब्राउज़र में सहेजी जाती है।')}</p>`;
    d.querySelectorAll('[data-theme-key]').forEach(b => b.onclick = () => { look.theme = b.dataset.themeKey; look.accent = ''; saveLook(); });
    d.querySelectorAll('[data-accent]').forEach(b => b.onclick = () => { look.accent = b.dataset.accent; saveLook(); });
    d.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { look.mode = b.dataset.mode; saveLook(); });
    d.querySelectorAll('[data-chart]').forEach(b => b.onclick = () => { look.chart = b.dataset.chart; saveLook(); });
    d.querySelectorAll('[data-size]').forEach(b => b.onclick = () => stepSize(+b.dataset.size));
    $('accentPick').oninput = e => { look.accent = e.target.value; try { localStorage.setItem('pm-look', JSON.stringify(look)); } catch (er) {} applyLook(); };
    $('accentPick').onchange = () => saveLook();
    $('lookReset').onclick = () => { look = { theme: 'royal', accent: '', mode: 'auto', chart: 'north', size: 15 }; saveLook(); };
    $('lookClose').onclick = closeLook;
    $('clearData').onclick = () => { if (!confirm(hiEn('Delete every saved client, tried name, mobile, vehicle and account check? This cannot be undone.', 'सारा सहेजा डेटा हटाएँ? यह वापस नहीं होगा।'))) return; clearAllData(); renderDrawer(); $('clearMsg').textContent = hiEn('All saved data deleted.', 'सारा डेटा हटाया गया।'); };
  }
  function openLook() { $('lookPanel').hidden = false; $('scrim').hidden = false; renderDrawer(); $('lookClose').focus(); }
  function closeLook() { $('lookPanel').hidden = true; $('scrim').hidden = true; $('tabs').classList.remove('open'); }
  const SIZES = [13, 14, 15, 16, 17, 18, 20];
  function stepSize(d) { const i = SIZES.indexOf(look.size), j = d === 0 ? 2 : Math.max(0, Math.min(SIZES.length - 1, (i < 0 ? 2 : i) + d)); look.size = SIZES[j]; try { localStorage.setItem('pm-look', JSON.stringify(look)); } catch (e) {} applyLook(); renderDrawer(); sizeBtns(); }
  function sizeBtns() { $('fsDown').disabled = look.size <= SIZES[0]; $('fsUp').disabled = look.size >= SIZES[SIZES.length - 1]; }
  $('fsUp').onclick = () => stepSize(1); $('fsDown').onclick = () => stepSize(-1); $('fsReset').onclick = () => stepSize(0); sizeBtns();
  $('lookBtn').onclick = openLook;
  $('scrim').onclick = closeLook;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLook(); });
  applyLook();

  // ---------- copy ----------
  function copyAny(text, msgId, taId) {
    const done = () => { $(msgId).textContent = T[lang].copied; };
    const fallback = () => { const ta = $(taId); ta.hidden = false; ta.value = text; ta.focus(); ta.select(); $(msgId).textContent = lang === 'hi' ? 'टेक्स्ट चुना गया है, कॉपी करें।' : 'Text selected below. Press Ctrl+C or Copy.'; };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }
  function copyText() {
    const D = state.day, t = T[lang], ff = ms => P.fmt(ms, state.place.tz, D.sunrise).replace(/<[^>]+>/g, '');
    const r = w => `${ff(w.start)}–${ff(w.end)}`;
    const lines = [
      `🕉 ${t.title} · ${dateTitle()} · ${nm(N.VAAR[D.wd])}`, `📍 ${state.place.name}`,
      `${t.sunrise} ${ff(D.sunrise)} · ${t.sunset} ${ff(D.sunset)}`,
      `${t.tithi}: ${D.tithis.map(x => `${tithiLabel(x)} ${t.upto} ${ff(x.end)}`).join(', ')}`,
      `${t.nak}: ${D.naks.map(x => `${nm(x.name)} ${t.upto} ${ff(x.end)}`).join(', ')}`,
      `${t.yoga}: ${D.yogas.map(x => `${nm(x.name)} ${t.upto} ${ff(x.end)}`).join(', ')}`,
      `${t.karana}: ${D.karanas.map(x => `${nm(x.name)} ${t.upto} ${ff(x.end)}`).join(', ')}`,
      `${monthName()} ${t.masa} · Vikram Samvat ${D.vikram}`,
      `❌ ${t.rahu} ${r(D.kaal.rahu)} · ${t.yama} ${r(D.kaal.yama)} · ${t.gulika} ${r(D.kaal.gulika)}`,
      `✅ ${t.abhijit} ${r(D.good.abhijit)}${D.good.amrit.length ? ` · ${t.amrit} ${D.good.amrit.map(r).join(', ')}` : ''}`,
    ];
    if (D.flags.length) lines.push('🔔 ' + D.flags.map(x => lang === 'hi' ? x.hi : x.en).join(', '));
    const text = lines.join('\n');
    const done = () => { $('copyMsg').textContent = t.copied; };
    const fallback = () => { const ta = $('copyFallback'); ta.hidden = false; ta.value = text; ta.focus(); ta.select(); $('copyMsg').textContent = lang === 'hi' ? 'टेक्स्ट चुना गया है, कॉपी करें।' : 'Text selected below. Press Ctrl+C or Copy.'; };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }

  run();
  Store.connect();
  setInterval(() => { if (tab === 'panchang' || tab === 'chog') softRender(); }, 60000);
})();
</script>

</body>
</html>
